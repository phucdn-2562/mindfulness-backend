services:
  redis:
    image: redis:alpine
    container_name: mindfulness-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mindfulness-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
